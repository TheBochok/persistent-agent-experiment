<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Debug</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .btn { 
            background: #0f0; color: #000; padding: 15px; text-align: center; 
            font-weight: bold; cursor: pointer; margin: 20px 0; border-radius: 5px;
        }
        #console { background: #111; padding: 10px; border: 1px solid #333; font-size: 12px; height: 300px; overflow-y: scroll; }
        .err { color: #f00; }
        .msg { color: #0f0; }
    </style>
</head>
<body>
    <h3>ARIA DEBUG CONSOLE</h3>
    <div id="console">Initializing...</div>
    
    <div class="btn" onclick="manualTest()">RUN MANUAL TEST</div>

    <script>
        const tg = window.Telegram.WebApp;
        const cons = document.getElementById('console');

        function print(msg, isErr = false) {
            const div = document.createElement('div');
            div.className = isErr ? 'err' : 'msg';
            div.textContent = `> ${new Date().toLocaleTimeString()}: ${msg}`;
            cons.prepend(div);
        }

        try {
            tg.ready();
            tg.expand();
            print("Telegram WebApp Ready");
            print("User ID: " + (tg.initDataUnsafe?.user?.id || "NULL"));
        } catch (e) {
            print("TG Init Error: " + e.message, true);
        }

        async function manualTest() {
            const id = tg.initDataUnsafe?.user?.id;
            if (!id) {
                print("ABORT: No user ID found", true);
                return;
            }

            print("Attempting fetch to /api/status/" + id);
            try {
                const start = Date.now();
                const res = await fetch('/api/status/' + id);
                const end = Date.now();
                print(`Fetch completed in ${end-start}ms. Status: ${res.status}`);
                
                if (res.ok) {
                    const data = await res.json();
                    print("Data received: " + JSON.stringify(data).substring(0, 50) + "...");
                } else {
                    print("Server returned error state", true);
                }
            } catch (e) {
                print("Fetch Exception: " + e.message, true);
            }
        }

        // Initial test
        setTimeout(manualTest, 1000);
    </script>
</body>
</html>
